name: Benchmarks
on:
  push:
    branches:
      - master
jobs:
  Benchmarks:
    runs-on: ubuntu-latest
    container: ghcr.io/notional-labs/cosmos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23' # The Go version to download (if necessary) and use.
      - name: run benchmarks
        run: make bench
