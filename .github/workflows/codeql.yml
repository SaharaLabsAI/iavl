name: "CodeQL"

on:
  push:
    branches: [ "master", "iavl2" ]
  pull_request:
    branches: [ "master", "iavl2" ]
  schedule:
    - cron: "15 1 * * 5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ go ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality,./.github/codeql/
          config: |
            query-filters:
              - exclude:
                  id: go/useless-assignment-to-local
              - include:
                  tags: security
              - include:
                  tags: reliability  
              - include:
                  tags: performance

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          wait-for-processing: true

  security-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL for Security
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended,security-and-quality,./.github/codeql/

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Security Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go/security"

  custom-analysis:
    name: Custom Go Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL for Custom Queries
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: ./.github/codeql/go-custom-security.qls

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Custom Query Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go/custom"
